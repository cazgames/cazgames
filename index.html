<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caz Arcade</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      box-sizing: border-box;
    }
    header {
      text-align: center;
      width: 100%;
      max-width: 600px;
      margin-bottom: 24px;
    }
    h1 {
      color: var(--accent);
      margin: 0 0 6px 0;
      font-size: 2.2rem;
    }
    p {
      color: var(--muted);
      margin: 0 0 16px 0;
    }
    #searchBar {
      width: 100%;
      padding: 12px 18px;
      font-size: 1rem;
      border-radius: 10px;
      border: 1px solid #334155;
      background: var(--card-bg);
      color: var(--text);
      outline: none;
      box-sizing: border-box;
    }
    #searchBar:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 1000px;
    }
    .card {
      background: var(--card-bg);
      padding: 18px 12px;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      border: 1px solid #334155;
      transition: transform 0.15s ease, border-color 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }
    .icon {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }
    .card h3 {
      margin: 0 0 4px 0;
      font-size: 1.05rem;
    }
    .card span {
      font-size: 0.8rem;
      color: var(--muted);
    }
    #emptyMsg {
      display: none;
      color: var(--muted);
      margin-top: 32px;
      font-size: 1.1rem;
    }
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #modal.open { display: flex; }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 92vw;
      max-width: 980px;
      margin-bottom: 10px;
    }
    #gameTitle {
      color: var(--accent);
      font-size: 1.2rem;
      font-weight: bold;
    }
    .btn-group { display: flex; gap: 8px; }
    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .fs-btn { background: #334155; color: white; }
    .fs-btn:hover { background: #475569; }
    .close-btn { background: #ef4444; color: white; }
    .close-btn:hover { background: #dc2626; }
    iframe {
      width: 92vw;
      max-width: 980px;
      height: 78vh;
      border: 2px solid var(--accent);
      border-radius: 8px;
      background: black;
    }
  </style>
</head>
<body>

  <header>
    <h1>Caz Arcade</h1>
    <p>Fast browser games</p>
    <input type="text" id="searchBar" placeholder="🔍 Search games..." oninput="filterGames()">
  </header>

  <div class="grid" id="gameGrid"></div>
  <div id="emptyMsg">No games match your search!</div>

  <div id="modal">
    <div class="controls">
      <span id="gameTitle">Game</span>
      <div class="btn-group">
        <button class="btn fs-btn" onclick="toggleFullscreen()">Fullscreen ⛶</button>
        <button class="btn close-btn" onclick="closeGame()">Close ✕</button>
      </div>
    </div>
    <iframe id="gameBox" src="" allowfullscreen allow="autoplay; fullscreen; pointer-lock"></iframe>
  </div>

  <script>
    const games = [
      { 
        title: "FNAF 3D Survival", 
        cat: "3D Horror", 
        icon: "🐻", 
        type: "embed",
        // Direct WebGL 3D port with full power management & camera controls
        url: "https://wellsousaaa.github.io/Five-Nights-at-Freddys-Web/" 
      },
      { 
        title: "Block Craft 3D", 
        cat: "3D Sandbox", 
        icon: "🟩", 
        type: "embed",
        // Pure clean 3D client without branding banners
        url: "https://eaglercraft1-8.github.io/" 
      },
      { 
        title: "Cookie Clicker", 
        cat: "Idle", 
        icon: "🍪", 
        type: "popup", 
        url: "https://ozh.github.io/cookieclicker/" 
      },
      { 
        title: "Paper Minecraft 2D", 
        cat: "2D Sandbox", 
        icon: "⛏️", 
        type: "embed",
        url: "https://turbowarp.org/10128407/embed" 
      },
      { 
        title: "Slope 3D", 
        cat: "3D Runner", 
        icon: "🟢", 
        type: "embed",
        url: "https://turbowarp.org/535492211/embed" 
      },
      { 
        title: "Tower Building", 
        cat: "Arcade", 
        icon: "🏗️", 
        type: "embed",
        url: "https://www.towergame.app/" 
      },
      { 
        title: "Connect 4", 
        cat: "Board", 
        icon: "🔴", 
        type: "embed",
        url: "https://papergames.io/en/connect4" 
      },
      { 
        title: "Flappy Bird", 
        cat: "Arcade", 
        icon: "🐦", 
        type: "embed",
        url: "https://turbowarp.org/694936302/embed" 
      }
    ];

    const grid = document.getElementById('gameGrid');
    const emptyMsg = document.getElementById('emptyMsg');

    function renderGames(list) {
      grid.innerHTML = '';
      if (list.length === 0) {
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';
      list.forEach(game => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => {
          if (game.type === "popup") {
            window.open(game.url, '_blank', 'width=1000,height=700,menubar=no,toolbar=no');
          } else {
            playGame(game.title, game.url);
          }
        };
        card.innerHTML = `
          <div class="icon">${game.icon}</div>
          <h3>${game.title}</h3>
          <span>${game.cat}</span>
        `;
        grid.appendChild(card);
      });
    }

    function filterGames() {
      const q = document.getElementById('searchBar').value.toLowerCase().trim();
      const filtered = games.filter(g => 
        g.title.toLowerCase().includes(q) || 
        g.cat.toLowerCase().includes(q)
      );
      renderGames(filtered);
    }

    function playGame(title, url) {
      document.getElementById('gameTitle').innerText = title;
      document.getElementById('gameBox').src = url;
      document.getElementById('modal').classList.add('open');
    }

    function closeGame() {
      document.getElementById('gameBox').src = '';
      document.getElementById('modal').classList.remove('open');
    }

    function toggleFullscreen() {
      const frame = document.getElementById('gameBox');
      if (!document.fullscreenElement) {
        frame.requestFullscreen().catch(err => alert("Fullscreen error: " + err.message));
      } else {
        document.exitFullscreen();
      }
    }

    renderGames(games);
  </script>
</body>
</html>
    renderGames(games);
  </script>
</body>
</html>
