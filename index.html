<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caz Games Hub</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 { color: #38bdf8; margin-bottom: 5px; }
    p { color: #94a3b8; margin-top: 0; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 800px;
      margin-top: 20px;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      border: 1px solid #334155;
      transition: transform 0.15s, border-color 0.15s;
    }
    .card:hover { transform: translateY(-4px); border-color: #38bdf8; }
    .icon { font-size: 2.5rem; margin-bottom: 8px; }
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #modal.open { display: flex; }
    iframe {
      width: 90vw;
      max-width: 960px;
      height: 75vh;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      background: black;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      width: 90vw;
      max-width: 960px;
      margin-bottom: 10px;
    }
    .close-btn {
      padding: 8px 16px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Caz Games Hub</h1>
  <p>Pick a game to play!</p>

  <div class="grid">
    <!-- 1. Real Working Cookie Clicker (GitHub Mirror) -->
    <div class="card" onclick="playGame('Cookie Clicker', 'https://ozh.github.io/cookieclicker/')">
      <div class="icon">🍪</div>
      <h3>Cookie Clicker</h3>
      <span>Idle Game</span>
    </div>

    <!-- 2. Original 2048 (GitHub Pages) -->
    <div class="card" onclick="playGame('2048', 'https://gabrielecirulli.github.io/2048/')">
      <div class="icon">🔢</div>
      <h3>2048</h3>
      <span>Puzzle</span>
    </div>

    <!-- 3. Classic Snake (Fast HTML5) -->
    <div class="card" onclick="playGame('Snake', 'https://googlesnake.github.io/')">
      <div class="icon">🐍</div>
      <h3>Google Snake</h3>
      <span>Arcade</span>
    </div>

    <!-- 4. Flappy Bird (Embeddable HTML5) -->
    <div class="card" onclick="playGame('Flappy Bird', 'https://flappybird.io/')">
      <div class="icon">🐦</div>
      <h3>Flappy Bird</h3>
      <span>Classic</span>
    </div>
  </div>

  <div id="modal">
    <div class="controls">
      <span id="gameTitle" style="color:#38bdf8; font-weight:bold; font-size:1.1rem; align-self:center;"></span>
      <button class="close-btn" onclick="closeGame()">Close Game ✕</button>
    </div>
    <iframe id="gameBox" src="" allowfullscreen allow="autoplay; fullscreen"></iframe>
  </div>

  <script>
    function playGame(title, url) {
      document.getElementById('gameTitle').innerText = title;
      document.getElementById('gameBox').src = url;
      document.getElementById('modal').classList.add('open');
    }
    function closeGame() {
      document.getElementById('gameBox').src = '';
      document.getElementById('modal').classList.remove('open');
    }
  </script>
</body>
</html>
